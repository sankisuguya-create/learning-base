<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学習BASE（見本）</title>
<link rel="stylesheet" href="home.css">
<style>body{margin:0;background:#fff}.demo-bar{font:14px sans-serif;padding:4px 16px;background:#eee;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.demo-bar a{display:inline-flex;align-items:center;min-height:56px;min-width:120px;padding:0 8px}</style>
</head>
<body>
<div class="demo-bar">見本（GAS なし・この端末だけ）：
  <a href="?role=child3">3年の児童</a><a href="?role=child1">1年の児童</a><a href="?role=teacher">先生</a><a href="?role=guest">名簿にない人</a>
  <a href="#" onclick="localStorage.removeItem('lb-demo');location.reload();return false">見本の設定を消す</a></div>
<main id="lb" class="lb"></main>
<script src="demo-data.js"></script>
<script>
// 見本の Platform 層：本番の GAS（google.script.run）の代わりに、この端末の localStorage に保存する
(function () {
  var role = (new URLSearchParams(location.search).get('role')) || 'child3';
  function store() { try { return JSON.parse(localStorage.getItem('lb-demo') || '{}'); } catch (e) { return {}; } }
  function put(s) { try { localStorage.setItem('lb-demo', JSON.stringify(s)); } catch (e) {} }
  function settings(k) { var s = store(); return s[k] || { publish: {}, now: [{ page: 'tamath-kuku', order: 1 }, { page: 'kanzi', order: 2 }] }; }
  function setSettings(k, v) { var s = store(); s[k] = v; put(s); return v; }
  var members = [{ lid: 'La', no: 1, name: 'あおき そら' }, { lid: 'Lb', no: 2, name: 'いとう はな' }, { lid: 'Lc', no: 30, name: 'てんにゅう たろう', provisional: true }];
  // 見本の「閾値を見直す」：本物の項目（web/demo-data.js。gas/Alerts.gs から作る）と、値で動く架空の件数
  function demoTuning(vals) {
    var spec = LB_DEMO.spec.map(function (a) { var has = vals[a.path] !== undefined && vals[a.path] !== '', o = {}; for (var k in a) o[k] = a[k];
      o.value = has ? Number(vals[a.path]) : a.def; o.changed = has && Number(vals[a.path]) !== a.def; return o; });
    var v = function (p) { return spec.filter(function (x) { return x.path === p; })[0].value; };
    var c = { drop: Math.max(0, Math.round(40 - v('drop.accDrop') * 200)), klass: Math.max(0, Math.round(10 * v('klass.accBelow') / v('klass.share') - 8)), stall: Math.max(0, Math.round(600 / v('stall.minN'))), classes: 12 };
    return { spec: spec, counts: c, sens: [{ label: '正答率の下がり幅（これ以上で出す）', unit: 'ポイント', scale: 100, now: 0.15, value: 0.1, drop: 20, klass: c.klass, stall: c.stall, classes: 14 }],
      dist: { hist: { dropAcc: [['上がった', '41'], ['0〜5', '60'], ['5〜10', '22'], ['10〜15', '9'], ['15〜20', '5人未満'], ['20以上', '5人未満']], dropTime: [['0.9倍未満', '18']], stallAcc: [['0〜2', '12']], stallTime: [['0.97〜1.03倍', '11']], klassShare: [['3割未満', '30']] } },
      perf: [{ week: '2026-11-09', kind: 'drop', fired: 9, changed: 3, seen: 4, open: 2 }] };
  }
  var DEMO_RESULTS = [{ id: 'r1', app: '算数タイムアタック', skill: '長さ：cm→mm', from: '2026-10-26', to: '2026-11-08', names: ['あおき そら'],
    text: '正答率 58% → 79%・時間 3.1秒 → 2.4秒（同じ学年のほかの児童 24人は正答率 +3ポイント）。本番の記録で、前の4週と期間中を比べた目安です' }];
  var api = {
    homeBoot: function (opt) {
      if (opt && (opt.start || opt.dead)) { var st = store(); (st.boots = st.boots || []).push({ start: opt.start || null, dead: opt.dead || 0 }); put(st); }
      var b = { role: role.indexOf('child') === 0 ? 'child' : role, today: new Date().toISOString().slice(0, 10), pagesUrl: '../catalog/pages.json', subjects: LbPages.SUBJECTS };
      b.links = { kuku: { color: 'mint', url: '', subtitle: '3年' }, divmod: { color: 'blue', subtitle: '3年' }, length: { color: 'amber' }, weight: { color: 'red' },
        bignum: { color: 'purple' }, decimal: { color: 'teal' }, circle: { color: 'cobalt' }, kakehissan: { color: 'coral' }, bai: { color: 'ochre' },
        'toi-board': { url: 'https://example.com/toi-board', color: 'lavender' }, kanzi: { url: 'https://example.com/kanzi', color: 'green' } };
      var ov = store().links || {}; for (var lk in ov) b.links[lk] = Object.assign({}, b.links[lk] || {}, { url: ov[lk] });   // 見本：所有者が入れた URL
      if (b.role === 'child') { var g = role === 'child1' ? 1 : 3; b.learner = { name: 'たなか はなこ', mei: 'はなこ', grade: g, cls: '1' }; b.classKey = g + '-1'; b.settings = settings(b.classKey); }
      if (role === 'teacher') b.now3 = store().now3 || [
        { key: 'k1', kind: 'drop', canDirect: true, label: LB_DEMO.kinds.labels.drop, app: '算数タイムアタック', skill: '九九：7の段', names: ['いとう はな'], text: '正答率 90% → 62%・時間 1.5秒 → 2.1秒（今週 14問・前の4週と比べて）' },
        { key: 'k2', kind: 'klass', label: LB_DEMO.kinds.labels.klass, app: '算数タイムアタック', skill: '長さ：km→m', names: ['あおき そら', 'いとう はな', 'うえだ けん'], text: '取り組んだ 9人のうち 5人が正答率70%未満（直近2週）' },
        { key: 'k3', kind: 'stall', canDirect: true, label: LB_DEMO.kinds.labels.stall, app: '算数タイムアタック', skill: 'あまりのあるわり算：九九の逆', names: ['あおき そら'], text: '正答率 64% → 65%・時間 3.2秒 → 3.2秒（前の4週 30問 → 直近4週 28問）' }];
      if (role === 'teacher') { b.classes = [{ key: '3-1', grade: 3, cls: '1' }, { key: '1-1', grade: 1, cls: '1' }]; b.classKey = (opt && opt.classKey) || '3-1'; b.settings = settings(b.classKey); b.members = members; b.owner = true; b.kinds = LB_DEMO.kinds; b.directives = store().dirs || []; b.results = store().results || DEMO_RESULTS; }
      if (role === 'guest') b.message = 'なまえが まだ とうろく されていません。せんせいに つたえてね';
      return b;
    },
    homeDirect: function (k, key, days, show) {
      var s = store(), n3 = s.now3 || api.homeBoot().now3, a = n3.filter(function (x) { return x.key === key; })[0];
      s.now3 = n3.filter(function (x) { return x.key !== key; });
      s.dirs = (s.dirs || []).concat([{ id: 'd' + Date.now(), app: a.app, skill: a.skill, to: new Date(Date.now() + (days - 1) * 864e5).toISOString().slice(0, 10), show: !!show, names: a.names }]);
      put(s); return { now3: s.now3, directives: s.dirs, results: s.results || DEMO_RESULTS };
    },
    homeEndDirective: function (k, id) { var s = store(); s.dirs = (s.dirs || []).filter(function (d) { return d.id !== id; }); put(s); return { now3: s.now3 || api.homeBoot().now3, directives: s.dirs, results: s.results || DEMO_RESULTS }; },
    homeSeeResult: function (k, id, again) { var s = store(); s.results = (s.results || DEMO_RESULTS).filter(function (r) { return r.id !== id; }); put(s); return { now3: s.now3 || api.homeBoot().now3, directives: s.dirs || [], results: s.results }; },
    homeSetPublish: function (k, id, on) { var s = settings(k); s.publish[id] = on; return setSettings(k, s); },
    homeSetLink: function (id, url) { var s = store(); s.links = s.links || {}; s.links[id] = url; put(s); return api.homeBoot().links; },
    homeSetOrder: function (k, sub, ids) { var s = settings(k); s.order = s.order || {}; if (ids.length) s.order[sub] = ids; else delete s.order[sub]; return setSettings(k, s); },
    homeResetPublish: function (k) { var s = settings(k); s.publish = {}; return setSettings(k, s); },
    homeDecide: function (k, key) { var s = store(); s.now3 = (s.now3 || api.homeBoot().now3).filter(function (x) { return x.key !== key; }); put(s); return s.now3; },
    homeFeedback: function (k, v, t) { var s = store(); (s.fb = s.fb || []).push({ k: k, v: v, t: t }); put(s); return true; },
    homeReport: function (k, d) { var s = store(); (s.reports = s.reports || []).push([k, d || '']); put(s); return true; },
    homeExport: function () { return { ok: true, notes: ['1文字の名前かもしれない「空」を置き換えていません（2026-11-10 の気づき）'],
      text: '# 学習BASE 失敗と速さ\n書き出した日：（見本）\n\n## 1. 失敗\n…（本番では、失敗・速さ（端末別）・始めるまで・先生の設定・気づきが入ります）' }; },
    homeTuning: function () { return demoTuning(store().rules || {}); },
    homeTryRules: function (v) { var t = demoTuning(v); return { now: demoTuning(store().rules || {}).counts, tried: t.counts, bad: [] }; },
    homeSaveRules: function (v) { var s = store(), r = s.rules || {}; Object.keys(v).forEach(function (k) { if (v[k] === '') delete r[k]; else r[k] = v[k]; }); s.rules = r; put(s); return demoTuning(r); },
    homeSetNow: function (k, list) { var s = settings(k); s.now = list.map(function (x, i) { return { page: x.page, order: i + 1 }; }); return setSettings(k, s); }
  };
  window.LB_PLATFORM = {
    baseUrl: location.href.split('?')[0],
    call: function (name) { var a = Array.prototype.slice.call(arguments, 1); return new Promise(function (ok) { setTimeout(function () { ok(JSON.parse(JSON.stringify(api[name].apply(null, a)))); }, 150); }); },
    // 見本では、まだページの無い教科にも見本のページを足す（全教科の見え方を確かめるため。本番の目録には入らない）
    fetchJson: function (u) { return fetch(u).then(function (r) { return r.json(); }).then(function (c) {
      var have = {}; c.pages.forEach(function (p) { have[p.subject] = true; });
      LbPages.SUBJECTS.forEach(function (s, i) { if (!have[s.id]) c.pages.push({ id: 'demo-' + s.id, subject: s.id, grades: [1, 2, 3, 4, 5, 6], unit: '見本', title: s.label + 'の見本ページ', ruby: s.ruby + 'の みほん', kind: 'app', app: 'demo', order: 99 }); });
      return c; }); },
    open: function (u) { alert('開く：' + u); }
  };
})();
</script>
<script src="pages.js"></script>
<script src="home.js"></script>
</body>
</html>
